name: Demo CI
on:
  # Pull requests run on pull_request only; push covers master, so a PR isn't checked twice.
  push:
    branches: [ master ]
    paths: [ 'sdk/**', 'demo/**', '.github/workflows/demo.yaml' ]
  pull_request:
    paths: [ 'sdk/**', 'demo/**', '.github/workflows/demo.yaml' ]

permissions:
  contents: read

# A new push to a PR cancels its runs for older commits. Each push to master gets its own
# group, so master runs are never cancelled or replaced while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  demo-android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The demo uses the SDK from ../sdk, and installing it runs the SDK's build.
      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Install demo dependencies
        run: npm ci

      - name: Build Android app
        run: |
             cd android
             ./gradlew assembleDebug

  demo-ios-build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
             sudo xcode-select -switch /Applications/Xcode_16.4.app
             xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The demo uses the SDK from ../sdk, and installing it runs the SDK's build.
      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Install demo dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: demo/ios
        run: pod install

      - name: Build iOS app
        run: npx react-native build-ios
