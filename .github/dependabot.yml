version: 2
updates:
# Dependencies updates config for SDK
  - package-ecosystem: "npm"
    directory: "/sdk"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Matches the minimum Node in `engines`; raise it with that floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint must support a TypeScript major before the SDK can move to it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # The Babel and Jest presets are released with react-native and should match it.
      react-native:
        patterns:
          - "react-native"
          - "@react-native/*"

# Dependencies updates config for examples
  - package-ecosystem: "npm"
    directory: "/demo"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Package in example is accessed by path, 
      # do not update in package.json.
      - dependency-name: "raygun4reactnative"
      # A React Native upgrade also changes the native projects, so these
      # move together by hand, with the React Native Upgrade Helper.
      - dependency-name: "react"
      - dependency-name: "react-test-renderer"
      - dependency-name: "react-native"
      - dependency-name: "@react-native/*"
      # @react-native/eslint-config supports eslint 8 and 9 only.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/ExpoDemo"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Package in example is accessed by path,
      # do not update in package.json.
      - dependency-name: "raygun4reactnative"
      # Expo pins these to the versions its SDK supports. Update them
      # with `npx expo install` when moving to a new Expo SDK instead.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@types/react"
      - dependency-name: "typescript"
      # babel-preset-expo is built on Babel 7; move to a new Babel major
      # with the Expo SDK.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

# Github Actions dependencies updates config
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
